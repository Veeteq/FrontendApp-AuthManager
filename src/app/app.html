<nav class="bg-slate-800 text-white p-4 shadow-md">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <!-- Left side: Navigation links -->
    <div class="flex gap-6">      
      @if (user()) {
      <!--  Home: Always available (or protected by AuthGuard) -->
      <a routerLink="/" 
         routerLinkActive="text-blue-400 border-b-2 border-blue-400" 
         [routerLinkActiveOptions]="{exact: true}"
         class="hover:text-blue-400 transition-colors">
         Home
      </a>
      @if (isAdmin()) {
        <a routerLink="/users" 
           routerLinkActive="text-blue-400 border-b-2 border-blue-400"          
           class="hover:text-blue-400 transition-colors">
           Users
        </a>
      }
    }
    
   <!-- Guest view: Visible only when not logged in -->
      @if (!user()) {
        <a routerLink="/user/login" 
           routerLinkActive="text-blue-400 border-b-2 border-blue-400" 
           class="hover:text-blue-400 transition-colors">
           Login
        </a>
        <a routerLink="/user/register" 
           routerLinkActive="text-blue-400 border-b-2 border-blue-400" 
           class="hover:text-blue-400 transition-colors">
           Register
        </a>
      }
    </div>

    <!-- Right side: User actions -->
    @if (user()) {
      <div class="flex items-center gap-4">
        <span class="text-slate-400 text-sm">Welcome, {{ user()?.firstName }}!</span>
        <button (click)="logout()" class="hover:text-red-400 transition-colors font-medium">
          Logout
        </button>
      </div>
    }
  </div>
</nav>

<!-- Główny kontener aplikacji -->
<main class="max-w-7xl mx-auto mt-8 px-4">
  <app-alert></app-alert>
  <router-outlet></router-outlet>
</main>
