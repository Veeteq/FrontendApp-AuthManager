<!-- Main alert container visible only when an alert exists -->
@if (alert) {
  <div class="mt-4 px-4 mx-auto max-w-7xl animate-fade-in">
    <!-- 
      Flex container:
      'flex' enables flexbox layout.
      'items-center' aligns message and button vertically.
      'justify-between' pushes the message to the left and the button to the right.
    -->
    <div [class]="alert.cssClass" class="flex items-center justify-between p-4 rounded-lg border shadow-sm transition-all duration-300">
      
      <!-- Left side: Message text -->
      <span class="text-sm font-medium">{{alert.message}}</span>

      <!-- Right side: Close button -->
      <button (click)="alertService.clear()" class="ml-4 text-current opacity-60 hover:opacity-100 transition-opacity focus:outline-none"aria-label="Close">
        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>

    </div>
  </div>
}
