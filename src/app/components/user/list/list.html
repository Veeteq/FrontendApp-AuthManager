<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Users</h1>
    <a routerLink="add" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-semibold transition">
      Add User
    </a>
  </div>
  <div class="overflow-x-auto bg-white rounded-lg shadow">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">First Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
          <th class="px-6 py-3"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        @for (user of users(); track user.id) {
        <tr>
          <td class="px-6 py-1 whitespace-nowrap text-sm text-gray-900">{{user.firstName}}</td>
          <td class="px-6 py-1 whitespace-nowrap text-sm text-gray-900">{{user.lastName}}</td>
          <td class="px-6 py-1 whitespace-nowrap text-sm text-gray-900">{{user.username}}</td>
          <td class="px-6 py-1 whitespace-nowrap text-right text-sm font-medium">
            <a [routerLink]="['edit', user.id]" class="text-blue-600 hover:text-blue-900 mr-1.5">Edit</a>
            <button (click)="deleteUser(user.id!)" 
              [disabled]="user.isDeleting"
              class="text-red-600 hover:text-red-900 cursor-pointer disabled:cursor-not-allowed disabled:opacity-50">
              @if (user.isDeleting) { <span>Deleting...</span> } @else { <span>Delete</span> }
            </button>
          </td>

        </tr>
        }
        @if (users() === null) {
        <tr>
          <td colspan="4" class="px-6 py-10 text-center">
            <div class="animate-pulse text-gray-500 text-sm">Loading users...</div>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
